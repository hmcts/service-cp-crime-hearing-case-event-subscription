server:
  port: ${SERVER_PORT:4550}

environment:
  name: ${ENVIRONMENT_NAME:UNKNOWN}
spring:
  application:
    name: service-cp-crime-hearing-results-document-subscription
  jpa:
    open-in-view: false
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:8}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

material-client:
  url: ${MATERIAL_CLIENT_URL:http://localhost:8081}
  cjscppuid: ${CJSCPPUID:00000000-0000-0000-0000-000000000000}

service-bus:
  # Emulator vs Azure is detected automatically from the connection string (https = Azure, sb:// = emulator)
  admin-connection: ${AZURE_SERVICE_BUS_ADMIN_URI:Endpoint=sb://localhost:5300;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
  connection: ${AZURE_SERVICE_BUS_URI:Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
  retry-durations: ${SERVICE_BUS_RETRY_DURATIONS:0s,1s,2s,5s,10s,30s,1m,2m,5m,5m,5m,5m,5m,5m,5m,5m,5m,5m,5m,1h,1h,1h,1h,4h}
  max-tries: ${SERVICE_BUS_MAX_TRIES:108}
  auto-start-processors: ${AZURE_SERVICE_BUS_AUTO_START_PROCESSORS:true}

document-service:
  url: ${DOCUMENT_SERVICE_URL:http://localhost:8082}

document:
  purge:
    retention-days: ${DOCUMENT_PURGE_RETENTION_DAYS:30}
    cron: ${DOCUMENT_PURGE_CRON:0 0 2 * * *}
    batch-size: ${DOCUMENT_PURGE_BATCH_SIZE:1000}

dead-letter:
  purge:
    retention-days: ${DEAD_LETTER_PURGE_RETENTION_DAYS:30}
    cron: ${DEAD_LETTER_PURGE_CRON:0 0 3 * * *}

queue-size:
  log:
    cron: ${QUEUE_SIZE_LOG_CRON:0 0 * * * *}

cp:
  audit:
    enabled: ${AUDIT_ENABLED:false}

subscription:
  oauth-enabled: ${SUBSCRIPTION_OAUTH_ENABLED:true}

hearing-event:
  disabled-in-dev: ${HEARING_EVENT_DISABLED_IN_DEV:false}
  json:
    enabled: ${HEARING_EVENT_JSON_ENABLED:true}

vault:
  enabled: ${AZURE_VAULT_ENABLED:false}
  uri: ${AZURE_VAULT_URI:}
  client-id: ${AZURE_CLIENT_ID:00000000-0000-0000-0000-000000000000}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
