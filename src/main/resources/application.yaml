server:
  port: ${SERVER_PORT:4550}

environment:
  name: ${ENVIRONMENT_NAME:UNKNOWN}
spring:
  application:
    name: service-cp-crime-hearing-results-document-subscription
  autoconfigure:
    exclude:
      - org.springframework.boot.jms.autoconfigure.JmsAutoConfiguration
      - org.springframework.boot.artemis.autoconfigure.ArtemisAutoConfiguration
  jpa:
    open-in-view: false
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:8}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

material-client:
  url: ${MATERIAL_CLIENT_URL:http://localhost:8081}
  cjscppuid: ${CJSCPPUID:00000000-0000-0000-0000-000000000000}

service-bus:
  # Emulator vs Azure is detected automatically from the connection string (https = Azure, sb:// = emulator)
  admin-connection: ${AZURE_SERVICE_BUS_ADMIN_URI:Endpoint=sb://localhost:5300;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
  connection: ${AZURE_SERVICE_BUS_URI:Endpoint=sb://localhost;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;}
  retry-durations: ${SERVICE_BUS_RETRY_DURATIONS:0s,1s,2s,5s,10s,30s,1m,2m,5m,5m,5m,5m,5m,5m,5m,5m,5m,5m,5m,1h,1h,1h,1h,4h}
  max-tries: ${SERVICE_BUS_MAX_TRIES:108}
  auto-start-processors: ${AZURE_SERVICE_BUS_AUTO_START_PROCESSORS:true}

document-service:
  url: ${DOCUMENT_SERVICE_URL:http://localhost:8082}

document:
  purge:
    retention-days: ${DOCUMENT_PURGE_RETENTION_DAYS:30}
    cron: ${DOCUMENT_PURGE_CRON:0 0 2 * * *}
    batch-size: ${DOCUMENT_PURGE_BATCH_SIZE:1000}

dead-letter:
  purge:
    retention-days: ${DEAD_LETTER_PURGE_RETENTION_DAYS:30}
    cron: ${DEAD_LETTER_PURGE_CRON:0 0 3 * * *}

queue-size:
  log:
    cron: ${QUEUE_SIZE_LOG_CRON:0 0 * * * *}

cp:
  audit:
    enabled: ${AUDIT_ENABLED:true}
    block-on-failure: ${AUDIT_BLOCK_ON_FAILURE:false}
    hosts:
      - ${ARTEMIS_HOST_PRIMARY:localhost}
      - ${ARTEMIS_HOST_SECONDARY:localhost}

auth:
  # OFF | OBSERVE | ENFORCE. OFF and OBSERVE take the client id from an UNVERIFIED token and are
  # rejected at startup in SIT/PRP/PRD by EntraAuthProperties.
  mode: ${AUTH_MODE:OBSERVE}
  # Injected per environment — no defaults on purpose.
  #
  # These identify the tenant that ISSUES the tokens and this API's registration inside that tenant.
  # Where the service is hosted in a different Azure tenant from the one issuing tokens, these are
  # the ISSUING tenant's values; the hosting tenant's directory id is the wrong answer.
  #
  # Leaving them blank makes EntraAuthProperties fail startup when mode is ENFORCE or OBSERVE. That
  # is deliberate: a default would let a deployment that forgot to inject come up healthy on another
  # environment's tenant and reject every token with INVALID_CLAIMS — a silent misconfiguration
  # rather than a loud one. Run locally with AUTH_MODE=OFF, which skips the check.
  #
  # v2.0 tokens carry the bare client-ID GUID, not api://<...>. It must be this API's own
  # registration: a token minted for a sibling CP API is correctly rejected on audience.
  tenant-id: ${AUTH_TENANT_ID:}
  audience: ${AUTH_AUDIENCE:}
  # Derived from tenant-id when blank.
  issuer: ${AUTH_ISSUER:}
  jwks-uri: ${AUTH_JWKS_URI:}
  clock-skew-seconds: ${AUTH_CLOCK_SKEW_SECONDS:60}
  jwks-cache-ttl-seconds: ${AUTH_JWKS_CACHE_TTL_SECONDS:600}

hearing-event:
  disabled-in-dev: ${HEARING_EVENT_DISABLED_IN_DEV:false}

vault:
  enabled: ${AZURE_VAULT_ENABLED:false}
  uri: ${AZURE_VAULT_URI:}
  client-id: ${AZURE_CLIENT_ID:00000000-0000-0000-0000-000000000000}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus
  health:
    jms:
      enabled: false
