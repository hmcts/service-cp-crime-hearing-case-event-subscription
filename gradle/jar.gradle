jar {
  enabled = true
  archiveClassifier.set('plain')
  manifest {
    attributes(
      'Implementation-Title': project.name,
      'Implementation-Version': project.version.toString()
    )
  }
  if (file("CHANGELOG.md").exists()) {
    from('CHANGELOG.md') {
      into 'META-INF'
    }
  } else {
    println "⚠️  CHANGELOG.md not found, skipping inclusion in JAR"
  }
}

bootJar {
  archiveFileName = "${rootProject.name}-${project.version}.jar"

  manifest {
    attributes('Implementation-Version': project.version.toString())
  }

  outputs.cacheIf { false }
}

tasks.withType(AbstractArchiveTask).configureEach {
  // bootJar must keep timestamps so build-info.properties version changes
  // produce a different JAR hash and are not silently skipped by Docker layer cache
  if (it.name != 'bootJar') {
    preserveFileTimestamps = false
  }
  reproducibleFileOrder = true
}
