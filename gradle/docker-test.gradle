tasks.register('dockerTest', Test) {
    description = "Spins up the full docker-compose stack, runs all *Integration* tests, then tears down"
    group = "Verification"

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    failFast = true

    filter {
        includeTestsMatching '*Integration*'
    }

    dependsOn tasks.composeUp
    finalizedBy tasks.composeDown
}

dockerCompose {
    useComposeFiles = ['docker/docker-compose.yml']
    startedServices = ['postgres', 'sqledge', 'servicebus-emulator']

    buildBeforeUp = false
    waitForTcpPorts = true
    upAdditionalArgs = ['--wait', '--wait-timeout', '120']

    captureContainersOutput = true
    removeOrphans = true
    stopContainers = true
    removeContainers = true

    useDockerComposeV2 = true
    dockerExecutable = 'docker'
}